<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silent Contract</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="tl" class="panel">
      <div id="loc"></div>
      <div id="objectives"></div>
    </div>
    <div id="sus">
      <div class="eye"><i></i></div>
      <div class="sus-main">
        <div id="sus-label">UNDETECTED</div>
        <div id="sus-bar"><div id="sus-fill"></div></div>
        <div id="sus-sub"></div>
      </div>
    </div>
    <div id="tr" class="panel">
      <canvas id="minimap" width="132" height="100"></canvas>
      <div id="room"></div>
    </div>
    <div id="bl" class="panel">
      <img id="dz-portrait" alt="">
      <div class="dz">
        <div class="cap">DISGUISE</div>
        <div id="dz-name"></div>
        <div id="dz-flags"></div>
        <div id="hp"><div id="hp-fill"></div></div>
      </div>
    </div>
    <div id="bc">
      <div id="prompts"></div>
      <div id="inv-name"></div>
      <div id="inv"></div>
    </div>
    <div id="toasts"></div>
    <div id="bubbles"></div>
    <div id="inspect" class="hidden"></div>
    <div id="hint">TAB intel · M map · SPACE instinct · T talk · ESC pause</div>
    <div id="room-banner"><div class="rb-name"></div><div class="rb-tier"></div></div>
  </div>

  <div id="intel" class="panel hidden">
    <h2>INTEL</h2>
    <ul id="intel-list"></ul>
    <button id="intel-close">Close [TAB]</button>
  </div>

  <div id="bigmap" class="panel hidden">
    <div class="bm-head"><h2>SITE MAP</h2><div class="legend"><span class="t0">Public</span><span class="t1">Staff</span><span class="t2">Security</span><span class="t3">Private</span><span class="ex">Exit</span><span class="cam">Camera</span></div></div>
    <canvas id="bigmap-c"></canvas>
    <div class="dim">[M] close · Rooms you are not allowed in are outlined in red for your current disguise.</div>
  </div>

  <div id="fade"></div>

  <div id="dialog" class="hidden">
    <div class="dlg-head">
      <img id="dlg-portrait" alt="">
      <div class="who">
        <div id="dlg-mode"></div>
        <div id="dlg-name"></div>
        <div id="dlg-role"></div>
      </div>
      <div class="dlg-side">
        <div id="dlg-ai"></div>
        <div class="dlg-sus"><span>THEIR SUSPICION</span><div class="bar"><div id="dlg-susbar"></div></div></div>
      </div>
    </div>
    <div id="dlg-log"></div>
    <div id="dlg-chips"></div>
    <form id="dlg-form" autocomplete="off">
      <input id="dlg-input" maxlength="220" placeholder="Say anything… explain yourself, lie, persuade, ask questions">
      <button type="submit">Say ⏎</button>
      <button type="button" id="dlg-leave">Walk away</button>
    </form>
  </div>

  <div id="screen" class="hidden"></div>

  <script src="js/util.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mapgen.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/input.js"></script>
  <script src="js/npc.js"></script>
  <script src="js/talk.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/campaign.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
